<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Light V Image AI</title>
  <meta name="description" content="Generator gambar AI ringan berbasis Pollinations API.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --panel: #18181b;
      --line: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent2: #60a5fa;
      --danger: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, #0f172a 0%, transparent 50%);
      background-attachment: fixed;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex-grow: 1;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeIn 0.5s ease-out;
    }

    .brand {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 2rem;
      align-items: start;
    }

    .card {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #e4e4e7;
      margin-bottom: 0.5rem;
    }

    textarea, select, input {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }

    textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 0.875rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .primary {
      background: var(--accent);
      color: white;
      flex: 1;
    }

    .primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
    }

    .status-container {
      margin-top: 1rem;
      min-height: 24px;
      text-align: center;
    }

    .status {
      font-size: 0.9rem;
      display: none;
      padding: 0.5rem;
      border-radius: 8px;
    }

    .status.show {
      display: block;
      animation: fadeIn 0.3s;
    }

    .status.info {
      color: var(--accent2);
      background: rgba(59, 130, 246, 0.1);
    }

    .status.error {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .status.ok {
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
    }

    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .preview-card {
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.2);
    }

    .preview-card img {
      width: 100%;
      height: auto;
      border-radius: calc(var(--radius) - 4px);
      display: block;
      animation: fadeIn 0.5s ease-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .empty-icon {
      font-size: 3rem;
      opacity: 0.5;
    }

    .loading-spinner {
      display: none;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite;
    }

    .image-actions {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .image-actions.show {
      display: grid;
    }

    .foot {
      text-align: center;
      padding: 2rem 0;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .foot a {
      color: var(--accent2);
      text-decoration: none;
      transition: color 0.2s;
    }

    .foot a:hover {
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .preview-card {
        min-height: 300px;
      }
    }

    @media (max-width: 480px) {
      .row {
        grid-template-columns: 1fr;
      }
      .brand {
        font-size: 2rem;
      }
      .wrap {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <h1 class="brand">Light V Image AI</h1>
    <p class="subtitle">Generator gambar AI ringan & cepat tanpa API key</p>
  </header>

  <main class="grid">
    <section class="card controls">
      <div class="form-group">
        <label for="prompt">Prompt Gambar</label>
        <textarea id="prompt" placeholder="Contoh: A futuristic cyberpunk city at night with neon lights, flying cars, highly detailed, 8k resolution" autofocus></textarea>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="model">Model AI</label>
          <select id="model">
            <option value="flux">Flux (Serbaguna)</option>
            <option value="zimage">Zimage (Cepat)</option>
            <option value="seedream5">Seedream5 (Detail)</option>
            <option value="nanobanana-2">Nanobanana-2</option>
            <option value="gptimage">GPT Image</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ratio">Rasio / Ukuran</label>
          <select id="ratio">
            <option value="1024x1024">1:1 (Square)</option>
            <option value="1280x720">16:9 (Landscape)</option>
            <option value="720x1280">9:16 (Portrait)</option>
            <option value="1536x1024">3:2 (Classic)</option>
            <option value="1024x1280">4:5 (Social)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="style">Style Tambahan (Opsional)</label>
        <select id="style">
          <option value="">Tidak ada tambahan</option>
          <option value="masterpiece, highly detailed, cinematic lighting, 8k resolution">Cinematic & Detail</option>
          <option value="anime style, studio ghibli, detailed background, vibrant colors">Anime / Ghibli</option>
          <option value="photorealistic, shot on 35mm lens, natural lighting, realistic textures">Photorealistic</option>
          <option value="digital illustration, clean lineart, concept art, trending on artstation">Digital Art</option>
          <option value="3d render, octane render, unreal engine 5, volumetric lighting">3D Render</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn primary" id="generate">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
          Generate
        </button>
        <button class="btn ghost" id="clear">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      </div>

      <div class="status-container">
        <div class="status" id="status"></div>
      </div>
    </section>

    <section class="preview-section">
      <div class="card preview-card" id="preview-container">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">✨</div>
          <p>Gambar hasil AI akan muncul di sini</p>
        </div>
        <div class="loading-spinner" id="loading"></div>
        <!-- Image will be inserted here -->
      </div>

      <div class="image-actions" id="image-actions">
        <button class="btn ghost" id="view-full">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
          Buka Penuh
        </button>
        <button class="btn primary" id="download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          Download
        </button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>Powered by <a href="https://pollinations.ai" target="_blank" rel="noopener noreferrer">Pollinations AI</a> | No API Key Required</p>
  </footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let currentImageUrl = "";

  function setStatus(text, type = "info") {
    const el = $("status");
    if (!text) {
      el.className = "status";
      return;
    }
    el.textContent = text;
    el.className = `status show ${type}`;
  }

  function getFullPrompt() {
    const prompt = $("prompt").value.trim();
    const style = $("style").value;
    if (!prompt) return "";
    return style ? `${prompt}, ${style}` : prompt;
  }

  async function generateImage() {
    const prompt = getFullPrompt();

    if (!prompt) {
      setStatus("Silakan masukkan prompt terlebih dahulu", "error");
      $("prompt").focus();
      return;
    }

    const btn = $("generate");
    const emptyState = $("empty-state");
    const loading = $("loading");
    const container = $("preview-container");
    const imgActions = $("image-actions");

    // UI Loading State
    btn.disabled = true;
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="loading-svg" style="animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Generating...';

    const existingImg = container.querySelector('img');
    if (existingImg) existingImg.remove();

    emptyState.style.display = "none";
    loading.style.display = "block";
    imgActions.classList.remove("show");

    setStatus("Sedang membuat gambar, mohon tunggu...", "info");

    try {
      const response = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: prompt,
          model: $("model").value,
          size: $("ratio").value
        })
      });

      let data;
      try {
        data = await response.json();
      } catch (e) {
        throw new Error(`Server error: ${response.status} ${response.statusText}`);
      }

      if (!response.ok) {
        throw new Error(data.error || "Gagal membuat gambar");
      }

      if (!data.image) {
        throw new Error("Format response tidak valid");
      }

      // Display Image
      currentImageUrl = data.image;
      const img = new Image();
      img.src = currentImageUrl;
      img.alt = prompt;

      img.onload = () => {
        loading.style.display = "none";
        container.appendChild(img);
        imgActions.classList.add("show");
        setStatus("Gambar berhasil dibuat!", "ok");
        btn.disabled = false;
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg> Generate Again';
      };

    } catch (error) {
      console.error(error);
      loading.style.display = "none";
      emptyState.style.display = "flex";
      setStatus(error.message, "error");
      btn.disabled = false;
      btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg> Try Again';
    }
  }

  // Event Listeners
  $("generate").addEventListener("click", generateImage);

  $("prompt").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      generateImage();
    }
  });

  $("clear").addEventListener("click", () => {
    $("prompt").value = "";
    $("style").value = "";
    currentImageUrl = "";

    const existingImg = $("preview-container").querySelector('img');
    if (existingImg) existingImg.remove();

    $("empty-state").style.display = "flex";
    $("loading").style.display = "none";
    $("image-actions").classList.remove("show");

    setStatus("");

    const btn = $("generate");
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg> Generate';
  });

  $("download").addEventListener("click", () => {
    if (!currentImageUrl) return;
    const a = document.createElement("a");
    a.href = currentImageUrl;
    a.download = `LightV-AI-${Date.now()}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  $("view-full").addEventListener("click", () => {
    if (!currentImageUrl) return;

    // Check if it's a data URL
    if (currentImageUrl.startsWith('data:')) {
      // Create a temporary window/tab to display the image
      const win = window.open();
      if (win) {
        win.document.write(`
          <body style="margin:0;display:flex;justify-content:center;align-items:center;background:#000;min-height:100vh;">
            <img src="${currentImageUrl}" style="max-width:100%;max-height:100vh;object-fit:contain;">
          </body>
        `);
      } else {
        setStatus("Pop-up diblokir browser, gunakan tombol download", "error");
      }
    } else {
      window.open(currentImageUrl, '_blank');
    }
  });
</script>

</body>
</html>
